<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Stylized Geometric "B" -->
  <g filter="url(#subtleGlow)">
    <!-- Vertical Backbone -->
    <rect x="36" y="28" width="12" height="64" rx="6" fill="url(#bGrad)" />
    
    <!-- Top Loop -->
    <path d="M42 28 H66 C77.0457 28 86 36.9543 86 48 C86 59.0457 77.0457 68 66 68 H42 Z" 
          fill="none" 
          stroke="url(#bGrad)" 
          stroke-width="11" 
          stroke-linejoin="round" />
          
    <!-- Bottom Loop -->
    <path d="M42 56 H69 C80.598 56 90 65.402 90 77 C90 88.598 80.598 98 69 98 H42 Z" 
          fill="none" 
          stroke="url(#bGrad)" 
          stroke-width="11" 
          stroke-linejoin="round" />
          
    <!-- Core Inner Connection Accent -->
    <circle cx="64" cy="48" r="3.5" fill="#ffffff" />
    <circle cx="67" cy="77" r="3.5" fill="#ffffff" />
  </g>
</svg>
